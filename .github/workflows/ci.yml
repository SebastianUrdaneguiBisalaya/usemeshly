name: CI

# The same gate as the publish workflow, on every pull request and on `main`, so a broken package never waits until
# release time to be noticed. Hooks run these locally too, but they can be skipped with --no-verify.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4 # keep in sync with devEngines.packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Smoke-check the packed packages (ESM, CJS, types)
        run: pnpm run smoke:pack
